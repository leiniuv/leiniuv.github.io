<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lei Niu - Personal Website</title>
    <style>
        /* 全局样式 */
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f9f9f9;
            margin: 0;
            padding: 20px;
        }

        /* 页面最大宽度和左右分栏容器 */
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            display: flex; /* 开启弹性布局 */
            gap: 40px; /* 左右两栏间距 */
            border-radius: 8px;
        }

        /* 左侧边栏样式 */
        .sidebar {
            flex: 1; /* 占据1份宽度 */
            min-width: 250px;
            text-align: left;
            border-right: 1px solid #eee;
            padding-right: 20px;
        }
        
        .sidebar img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
            border: 2px solid #ddd;
        }

        .sidebar h1 {
            font-size: 24px;
            margin: 0 0 5px 0;
            color: #2c3e50;
        }
        .sidebar h2 {
            font-size: 16px;
            color: #666;
            margin: 0 0 15px 0;
            font-weight: normal;
        }
        .sidebar p {
            font-size: 14px;
            margin: 5px 0;
        }

        /* 导航链接 */
        .nav-links {
            margin-top: 30px;
            line-height: 2;
        }
        .nav-links a {
            text-decoration: none;
            color: #3498db;
            font-weight: bold;
        }
        .nav-links a:hover {
            text-decoration: underline;
        }

        /* 右侧正文区样式 */
